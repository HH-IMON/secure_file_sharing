{% extends 'base.html' %}

{% block title %}403 Forbidden - SecureShare{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 text-center">
    <div class="col-md-6">
        <i class="bi bi-lock-fill text-danger" style="font-size: 8rem;"></i>
        <h1 class="display-1 fw-bold text-dark mt-3">403</h1>
        <h3 class="text-warning mb-4">Access Denied</h3>
        <p class="text-muted mb-4">You don't have the cryptographic permissions required to access this resource or perform this action.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-info">
            <i class="bi bi-house-door me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
