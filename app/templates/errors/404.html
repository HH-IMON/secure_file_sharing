{% extends 'base.html' %}

{% block title %}404 Not Found - SecureShare{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 text-center">
    <div class="col-md-6">
        <i class="bi bi-search text-info opacity-50" style="font-size: 8rem;"></i>
        <h1 class="display-1 fw-bold text-dark mt-3">404</h1>
        <h3 class="text-info mb-4">Page Not Found</h3>
        <p class="text-muted mb-4">The resource you are looking for does not exist, has been deleted, or was never securely uploaded.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-info">
            <i class="bi bi-house-door me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
